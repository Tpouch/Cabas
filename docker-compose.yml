# Deployed with Coolify's Docker Compose build pack: every ${VAR} below becomes a field in
# Coolify, and ${VAR:?} fields must be filled before the first deployment. The app publishes
# APP_PORT on the server; an HTTPS reverse proxy (Nginx Proxy Manager) forwards the domain to
# <server LAN IP>:APP_PORT (see README).
services:
  app:
    build: .
    image: cabas:latest
    restart: unless-stopped
    environment:
      # Port the app listens on, inside the container and on the server.
      PORT: ${APP_PORT:-3000}
      # Use a password without URL special characters (e.g. `openssl rand -hex 24`).
      DATABASE_URL: postgresql://${POSTGRES_USER:-cabas}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-cabas}
      UPLOADS_DIR: /data/uploads
      TZ: ${TZ:-Europe/Paris}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      # true behind the HTTPS proxy. false only for a local plain-HTTP test.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      # APP_BIND (required): the server address the proxy connects to, e.g. its LAN IP. Allow this
      # port only from the proxy (see README, "Firewall").
      - "${APP_BIND:?set APP_BIND to the server address the proxy connects to}:${APP_PORT:-3000}:${APP_PORT:-3000}"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/login > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cabas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-cabas}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  uploads:
